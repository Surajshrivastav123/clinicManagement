name: Spring_Boot_build_and_deploy

on:
   push:
     branches:
       - main

env:
  IMAGE_NAME: spring-boot-app

jobs:
  build-deploye:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout-Source
        uses: actions/checkout@v4

      - name: Setting up java
        uses: actions/setup-java@v4
        with:
           distribution: temurin
           java-version: 21
           cache: maven

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Build-docker image
        run: docker build -t ${{secrets.DOCKER_USERNAME}}/${{env.IMAGE_NAME}} .

      - name: login with docker
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}

      - name: push image
        run: docker push ${{ secrets.DOCKER_USERNAME}}/${{ env.IMAGE_NAME}}:latest


      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{secrets.EC2_HOST}}
          username: ${{secrets.EC2_USER}}
          key: ${{secrets.EC2_SSH_KEY}}
          script:
            docker pull ${{secrets.DOCKER_USERNAME}}/${{env.IMAGE_NAME}}:latest
            docker stop spring-boot-app || true
            docker rm spring-boot-app || true
            docker run -d --name spring-boot-app --restart unless-stopped -p 8081:8081 \  ${{ secrets.DOCKER_USERNAME}}/spring-boot-app:latest
            docker image prune -f

